name: Release

# Build native installers for all three platforms on every version tag and
# attach them to a draft GitHub release. Publish the draft from the releases
# page after reviewing the assets.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # A flaky Electron binary download must not cost a whole release run.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "npm ci failed (attempt $attempt/3); retrying in 15s"
            sleep 15
          done
          exit 1

      - name: Typecheck
        run: npm run typecheck

      - name: Build and package
        # --publish never: electron-builder must NOT upload by itself (its
        # dotted asset names duplicated the workflow's on v1.0.0); the
        # softprops step below is the single upload path. electron-builder also
        # downloads the Electron runtime, so retry the build like npm ci.
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm run dist -- --publish never; then exit 0; fi
            echo "dist failed (attempt $attempt/3); retrying in 20s"
            sleep 20
          done
          exit 1

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.AppImage
            release/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts (workflow runs)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: openplot-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.AppImage
            release/*.tar.gz
          if-no-files-found: warn
