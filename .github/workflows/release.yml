name: Release

# Build native installers for all platforms on every version tag and attach
# them to a draft GitHub release. Publish the draft from the releases page
# after reviewing the assets.
#
# macOS signing/notarization is opt-in. Add these repository secrets to sign:
#   MAC_CERT_P12               base64 of the Developer ID .p12 certificate
#   MAC_CERT_PASSWORD          password for that .p12
#   APPLE_ID                   Apple account email
#   APPLE_APP_SPECIFIC_PASSWORD  app-specific password for that account
#   APPLE_TEAM_ID              Apple developer team id
# Without them the macOS build is unsigned (Gatekeeper needs Open on first run).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            extra_args: ''
          - os: macos-latest
            label: macos
            extra_args: ''
          - os: ubuntu-latest
            label: linux-x64
            extra_args: '--linux --x64'
          # Cross-build the arm64 AppImage/tarball on the x64 runner. The
          # suffix keeps the x64 asset names stable for the website, which
          # links to them by name.
          - os: ubuntu-latest
            label: linux-arm64
            extra_args: "--linux --arm64 '-c.linux.artifactName=OpenPlot.AI-${version}-arm64.${ext}'"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # A flaky Electron binary download must not cost a whole release run.
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            if npm ci; then exit 0; fi
            echo "npm ci failed (attempt $attempt/4); retrying in 20s"
            sleep 20
          done
          exit 1

      - name: Configure Apple signing
        # Only export the variables when the secrets exist. electron-builder
        # treats an empty CSC_LINK as a path and fails with "not a file".
        if: runner.os == 'macOS'
        shell: bash
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$MAC_CERT_P12" ]; then
            {
              echo "CSC_LINK=$MAC_CERT_P12"
              echo "CSC_KEY_PASSWORD=$MAC_CERT_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Developer ID certificate configured"
          else
            echo "No Developer ID certificate: building unsigned"
          fi
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            {
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
            echo "Notarization credentials configured"
          else
            echo "No notarization credentials: skipping notarization"
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Build and package
        # --publish never: electron-builder must NOT upload by itself (its
        # dotted asset names duplicated the workflow's on v1.0.0); the
        # softprops step below is the single upload path. electron-builder also
        # downloads the Electron runtime and its AppImage tool, so retry with a
        # longer backoff: the GitHub release CDN answers 504 for a few minutes
        # at a time, then recovers.
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if npm run dist -- --publish never ${{ matrix.extra_args }}; then exit 0; fi
            wait=$((attempt * 30))
            echo "dist failed (attempt $attempt/5); retrying in ${wait}s"
            sleep $wait
          done
          exit 1

      - name: Add zsync metadata for AppImage
        # AppImageUpdate uses the .zsync sidecar for delta downloads. Generate
        # one next to every AppImage this Linux job produced.
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y zsync
          shopt -s nullglob
          for appimage in release/*.AppImage; do
            name="$(basename "$appimage")"
            # GitHub Releases turns spaces into dots in asset names. Normalize
            # first so the URL and Filename inside the .zsync match the asset.
            safe="${name// /.}"
            if [[ "$name" != "$safe" ]]; then
              mv "$appimage" "$(dirname "$appimage")/$safe"
              appimage="$(dirname "$appimage")/$safe"
              name="$safe"
            fi
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${name}"
            else
              url="$name"
            fi
            echo "Generating zsync for $name"
            zsyncmake -u "$url" -o "${appimage}.zsync" "$appimage"
          done

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.AppImage
            release/*.zsync
            release/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts (workflow runs)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: openplot-${{ matrix.label }}
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.AppImage
            release/*.zsync
            release/*.tar.gz
          if-no-files-found: warn
